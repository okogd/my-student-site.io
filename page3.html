<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница 3</title>
<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <div id="menu">
        <div><a href="index.html">Главная</a></div>
        <div><a href="page2.html">Страница 2</a></div>
        <div><a href="page3.html">Страница 3</a></div>
        <div><a href="page4.html">Таблица</a></div>
        <div><a href="page5.html">Дивы</a></div>
    </div>
	
	    <div class="box" style="background-color: yellow; border: 2px solid black;">
        <h2 style="color: green; text-decoration: underline;">стили</h2>

        <a href="http://htmlbook.ru">Самоучитель CSS</a><br>
        <a href="http://htmlbook.ru">Справочник CSS</a>
    </div>

    <div class="main-content">

        <div id="output" class="result-box"></div>
    </div>

    <div class="sidebar-form">
        <form id="anketaForm">
            <h3>Анкета</h3>
            
            <p>Ваше имя:<br>
                <input type="text" name="userName" required>
            </p>
            

            <p>Ваш пол</p>
            <label><input type="radio" name="gender" value="женский">женский</label><br>
            <label><input type="radio" name="gender" value="мужской">мужской</label>

            <p>На каком курсе вы учитесь:</p>
            <select name="course" size="1">
                <option value="Первый">Первый</option>
                <option value="Второй">Второй</option>
                <option value="Третий">Третий</option>
                <option value="Четвёртый">Четвёртый</option>
            </select>

            <p>Какие языки программирования вы знаете?</p>
            <label><input type="checkbox" name="lang" value="Паскаль">Паскаль</label><br>
            <label><input type="checkbox" name="lang" value="СИ">СИ</label><br>
            <label><input type="checkbox" name="lang" value="Ассемблер">Ассемблер</label>

            <p>Напишите немного о себе</p>
            <textarea name="about" rows="3" style="width: 100%; box-sizing: border-box;"></textarea><br><br>

            <input type="submit" value="Отправка данных"><br><br>
            <input type="reset" value="Сброс значений полей">
        </form>
    </div>
	

    <script>

        const form = document.getElementById('anketaForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const userName = formData.get('userName');
            const gender = formData.get('gender') || 'не указан';
            const course = formData.get('course');
            const languages = formData.getAll('lang').join(', ') || 'нет';
            const about = formData.get('about') || 'нет данных';

            output.innerHTML = `
                <h3>Полученные данные:</h3>
                <p><b>Имя:</b> ${userName}</p>
                <p><b>Пол:</b> ${gender}</p>
                <p><b>Курс:</b> ${course}</p>
                <p><b>Языки:</b> ${languages}</p>
                <p><b>О себе:</b> ${about}</p>
            `;
            output.style.display = 'block';
        });

        form.addEventListener('reset', function() {
            output.style.display = 'none';
            output.innerHTML = '';
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Позиционирование</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        .left {
            float: left;
            width: 200px;
            background: lightblue;
        }
        .right {
            float: right;
            width: 200px;
            background: lightgreen;
        }
        .rel-block {
            position: relative;
            background: lightgray;
            height: 100px;
            margin-top: 150px; /* Чтобы не налезло на float */
        }
        .abs-block {
            position: absolute;
            top: 10px;
            left: 50px;
            background: orange;
        }
    </style>
</head>
<body>

    <div id="menu">
        <div><a href="index.html">Главная</a></div>
        <div><a href="page2.html">Страница 2</a></div>
        <div><a href="page3.html">Страница 3</a></div>
        <div><a href="page4.html">Таблица</a></div>
        <div><a href="page5.html">Дивы</a></div>
    </div>

    <div class="box">
        <h2>Блоки float</h2>
        <div class="left">Левый блок float</div>
        <div class="right">Правый блок float</div>
        
        <div class="rel-block">
            Родитель relative
            <div class="abs-block">Элемент absolute</div>
        </div>
    </div>

</body>
</html>
